# 테스트는 공유 원격 PostgreSQL을 건드리지 않는다.
# 여러 사람이 동시에 테스트를 돌리면 서로의 데이터를 밟기 때문이다.
spring:
  datasource:
    url: jdbc:h2:mem:collab_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    defer-datasource-initialization: true

  sql:
    init:
      mode: always

logging:
  level:
    org.hibernate.SQL: debug
