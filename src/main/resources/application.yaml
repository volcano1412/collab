spring:
  application:
    name: collab

  datasource:
    url: jdbc:h2:mem:collab;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create
    # 뷰 렌더링 중 영속성 컨텍스트를 열어 두지 않는다(커넥션 점유 방지).
    open-in-view: false
    # Hibernate가 테이블을 만든 뒤에 data.sql이 실행되도록 한다. 없으면 시드가 먼저 돌아 실패한다.
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: always

  h2:
    console:
      enabled: true
      path: /h2-console

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace
