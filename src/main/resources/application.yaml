spring:
  # 프로젝트 루트의 .env를 properties 형식으로 읽는다. 없으면 조용히 넘어간다(optional).
  # Spring Boot는 .env를 기본으로 읽지 않으므로 이 한 줄이 있어야 파일이 효력을 갖는다.
  config:
    import: optional:file:./.env[.properties]

  application:
    name: collab

  datasource:
    # 원격 공유 PostgreSQL. 값은 환경변수로 덮어쓸 수 있다.
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    # 공개 리포지토리로 낼 때는 아래 줄의 기본값을 지워 `${POSTGRES_PASSWORD}`로 만든다.
    # 그러면 .env(또는 OS 환경변수)에만 비밀번호가 남는다.
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      # 원격 DB라 커넥션 수립이 로컬보다 느리다. 기본 30초는 장애 시 응답이 너무 오래 매달린다.
      connection-timeout: 5000

  jpa:
    hibernate:
      # 공유 DB이므로 create / create-drop 금지 — 매 기동마다 남의 데이터까지 지운다.
      # update는 누락된 테이블 · 컬럼만 추가하고 삭제하지 않는다.
      ddl-auto: update
    # 뷰 렌더링 중 영속성 컨텍스트를 열어 두지 않는다(커넥션 점유 방지).
    open-in-view: false
    # Hibernate가 테이블을 만든 뒤에 data.sql이 실행되도록 한다. 없으면 시드가 먼저 돌아 실패한다.
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      # 영속 DB라 매 기동마다 시드를 다시 넣으면 중복 키로 실패한다.
      mode: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace
