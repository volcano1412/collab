services:
  collab-api:
    image: ghcr.io/volcano1412/collab:latest
    container_name: collab-api
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${APP_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp:size=64m
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
