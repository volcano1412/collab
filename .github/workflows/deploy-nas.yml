name: Build and deploy to NAS

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_to_nas:
        description: Deploy to NAS after publishing the image
        type: boolean
        required: true
        default: false

concurrency:
  group: nas-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Grant Gradle wrapper execute permission
        run: chmod +x gradlew

      - name: Test
        run: ./gradlew clean test --no-daemon

      - name: Set image name
        id: image
        shell: bash
        run: |
          echo "repository=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}:latest" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Sign in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.image.outputs.name }}
            ${{ steps.image.outputs.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    if: github.event_name == 'push' || inputs.deploy_to_nas
    runs-on: ubuntu-latest
    environment: nas-production
    steps:
      - name: Checkout deployment file
        uses: actions/checkout@v6

      - name: Configure SSH
        env:
          NAS_SSH_PRIVATE_KEY: ${{ secrets.NAS_SSH_PRIVATE_KEY }}
          NAS_SSH_KNOWN_HOSTS: ${{ secrets.NAS_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$NAS_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$NAS_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy with Docker Compose
        env:
          NAS_HOST: ${{ secrets.NAS_HOST }}
          NAS_PORT: ${{ secrets.NAS_PORT }}
          NAS_USER: ${{ secrets.NAS_USER }}
          NAS_DEPLOY_PATH: ${{ secrets.NAS_DEPLOY_PATH }}
        shell: bash
        run: |
          [[ "$NAS_PORT" =~ ^[0-9]+$ ]]
          [[ "$NAS_USER" =~ ^[A-Za-z0-9._-]+$ ]]
          [[ "$NAS_DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]]

          remote="$NAS_USER@$NAS_HOST"
          ssh -p "$NAS_PORT" "$remote" "mkdir -p '$NAS_DEPLOY_PATH'"
          scp -P "$NAS_PORT" docker-compose.nas.yml \
            "$remote:$NAS_DEPLOY_PATH/docker-compose.nas.yml"

          ssh -p "$NAS_PORT" "$remote" \
            "cd '$NAS_DEPLOY_PATH' && sh -s" <<'REMOTE'
          if docker compose version >/dev/null 2>&1; then
            compose='docker compose'
          else
            compose='docker-compose'
          fi

          $compose -f docker-compose.nas.yml pull
          $compose -f docker-compose.nas.yml up -d --remove-orphans
          $compose -f docker-compose.nas.yml ps
          REMOTE
